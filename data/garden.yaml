# בוט־ניק – נתוני הגינה ההתחלתיים (seed)
# מקור: רשימת המדידות מ־9.11.2026 + מפת המרפסת.
# הקובץ הזה הוא מקור האמת עד שהבוט עולה. בשלב 1 הוא נטען למסד הנתונים,
# ומאז השינויים נעשים דרך הבוט, לא כאן.
#
# מוסכמות:
#   - כל המידות בס"מ, חיצוניות, נמדדו כשהצמח שתול. נפח פנימי מחושב בקוד.
#   - null = לא נמסר עדיין. הבוט מחשב בעצמו מה חסר; ב־missing רק מה שאי אפשר לחשב.
#   - latin_verified: false = שם מדעי לפי הזיהוי שלי, לאימות מתמונה או מתווית.
#   - slot: קוד מהמפה. מיכל שעומד בין שני מקטעים מקבל slot + between.

garden:
  name: מרפסת בית
  city: כפר סבא
  lat: 32.18          # מעוגל לרמת עיר
  lon: 34.91
  timezone: Asia/Jerusalem
  shape: U
  floor_cm: [335, 460]
  ceiling_height_cm: 270
  ceiling: concrete      # תקרת בטון מלאה, מאוורר תקרה עם תאורה במרכז
  floor_surface: light outdoor tiles
  walls_cladding: light stone
  fan: true
  ac_condenser: unknown
  railings:
    main:  {length_cm: 473, height_cm: 99, material: glass, facing: SE (לאימות)}
    north: {length_cm: 291, height_cm: 99, material: glass, facing: N}
  back_wall: {width_cm: 220, height_cm: 215, material: concrete, window: false}
  upper_opening: {height_cm: 56, width_cm: 220, open_to_outside: true, rain_enters: unknown}
  shelf: "מדף בטון נמוך הצמוד לוויטרינה, לאורך שני המעקות"

slots:
  - {code: M1, area: main_railing, note: "ליד קיר הבטון והעמוד"}
  - {code: M2, area: main_railing}
  - {code: M3, area: main_railing}
  - {code: M4, area: main_railing}
  - {code: M5, area: main_railing, note: "לפני הפינה, ליד העמוד השמאלי"}
  - {code: P1, area: corner, note: "פינה בין המעקות, מאחורי העמוד המזרחי"}
  - {code: N1, area: north_railing, note: "קרוב לפינה"}
  - {code: N2, area: north_railing}
  - {code: N3, area: north_railing, note: "קרוב לקיר הבית"}
  - {code: G1, area: upper_opening, note: "פתח עליון, צד שמאל"}
  - {code: G2, area: upper_opening, note: "פתח עליון, צד ימין"}
  - {code: K1, area: back_wall}
  - {code: K2, area: back_wall}
  - {code: H1, area: ceiling_hanging, note: "וו בתקרה ליד קיר הבטון"}
  - {code: E1, area: entrance, note: "צד ימין של הכניסה, פנוי לאדניות", free: true}

# סוגי מיכלים חוזרים
container_types:
  red_rail_large:
    description: "אדנית מעקה אדומה גדולה, אליפטית, יושבת על המעקה משני צדדיו"
    shape: elliptical
    material: plastic
    color: red
    outer: {length: 60, width: 28, height: 25}   # רוחב נמדד 14.11.2026
    sections: [A, B]          # חוצץ מוגבה מעל המעקה; כל צד = אזור שתילה עם אדמה משותפת
    plants_per_section: 2
  red_rail_small:
    description: "אדנית מעקה אדומה קטנה, עגלגלה, יושבת על המעקה משני צדדיו"
    shape: roundish
    material: plastic
    color: red
    outer: {diameter: 30, height: 25}
    sections: [A, B]
    plants_per_section: 1

